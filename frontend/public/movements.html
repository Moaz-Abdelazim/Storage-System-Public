<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>سجل الحركات | مخزني</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preload" href="fonts/tajawal-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/tajawal-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>
<noscript><p class="p-8 text-center">لازم تفعّل JavaScript عشان النظام يشتغل.</p></noscript>

<div id="shell" data-perm="invoices.view,transfers.view" data-active="movements" data-title="سجل الحركات">
  <div x-data="movements" class="space-y-5">

    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><h1 class="text-2xl font-bold">سجل الحركات</h1><p class="mt-1 text-sm text-muted">كل فواتير الوارد والصادر وحركات النقل في مكان واحد</p></div>
      <div class="flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline" @click="exportExcel()" :disabled="exporting"><i class="fa-solid fa-file-excel text-green-600"></i>تصدير Excel</button>
        <a href="stock-in.html" class="btn btn-primary"><i class="fa-solid fa-arrow-down"></i>وارد</a>
        <a href="stock-out.html" class="btn bg-orange-500 text-white hover:bg-orange-600"><i class="fa-solid fa-arrow-up"></i>صادر</a>
      </div>
    </div>

    <div class="grid gap-4 sm:grid-cols-3">
      <div class="card card-pad flex items-center gap-4"><span class="grid h-12 w-12 place-items-center rounded-2xl bg-brand-500/10 text-xl text-brand-600"><i class="fa-solid fa-arrow-down"></i></span>
        <div><div class="kpi-label">فواتير الوارد</div><div class="text-2xl font-bold tabular-nums" x-text="totals ? num(totals.in_invoices_count) : '—'"></div><div class="text-xs text-muted" x-text="totals ? money(totals.in_total_value) : ''"></div></div></div>
      <div class="card card-pad flex items-center gap-4"><span class="grid h-12 w-12 place-items-center rounded-2xl bg-orange-500/10 text-xl text-orange-600"><i class="fa-solid fa-arrow-up"></i></span>
        <div><div class="kpi-label">فواتير الصادر</div><div class="text-2xl font-bold tabular-nums" x-text="totals ? num(totals.out_invoices_count) : '—'"></div><div class="text-xs text-muted" x-text="totals ? money(totals.out_total_value) : ''"></div></div></div>
      <div class="card card-pad flex items-center gap-4"><span class="grid h-12 w-12 place-items-center rounded-2xl bg-blue-500/10 text-xl text-blue-600"><i class="fa-solid fa-right-left"></i></span>
        <div><div class="kpi-label">حركات النقل</div><div class="text-2xl font-bold tabular-nums" x-text="totals ? num(totals.transfers_count) : '—'"></div><div class="text-xs text-muted" x-text="totals ? num(totals.transfers_quantity) + ' قطعة' : ''"></div></div></div>
    </div>

    <section class="card card-pad">
      <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-12">
        <div class="seg xl:col-span-4 xl:justify-self-start" role="tablist" aria-label="نوع الحركة">
          <template x-for="k in kinds" :key="k.key"><button type="button" class="seg-btn" :class="f.kind === k.key && 'seg-btn-on'" @click="f.kind = k.key; apply()" x-text="k.label"></button></template>
        </div>
        <div class="flex items-center gap-2 md:col-span-2 xl:col-span-4">
          <input type="date" class="input" x-model="f.date_from" @change="apply()" aria-label="من تاريخ"><span class="text-muted">←</span><input type="date" class="input" x-model="f.date_to" @change="apply()" aria-label="إلى تاريخ">
        </div>
        <div class="relative xl:col-span-2"><i class="fa-solid fa-magnifying-glass pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted"></i>
          <input type="search" class="input ps-10" placeholder="المورد / الجهة..." x-model="f.party" @input.debounce.350ms="apply()" aria-label="بحث بالجهة"></div>
        <div class="xl:col-span-2"><ui-select source="usernames" placeholder="كل المستخدمين" clearable @pick="f.user = $event.detail.value || ''; apply()"></ui-select></div>
      </div>
      <div class="mt-3 flex flex-wrap gap-2 text-xs">
        <template x-for="p in presets" :key="p.label"><button type="button" class="badge badge-mute cursor-pointer hover:bg-line" @click="preset(p.days)" x-text="p.label"></button></template>
      </div>
    </section>

    <section class="card">
      <div class="overflow-x-auto px-3 pt-3">
        <table class="tbl">
          <thead><tr><th>النوع</th><th>المرجع</th><th>الجهة / المكان</th><th>بواسطة</th><th>التاريخ</th><th>الأصناف</th><th>القيمة</th></tr></thead>
          <tbody>
            <template x-if="loading && !rows.length"><template x-for="i in 8"><tr><td colspan="7"><div class="skeleton h-7"></div></td></tr></template></template>
            <template x-for="r in rows" :key="r.key">
              <tr :class="loading && 'opacity-60'">
                <td><span class="inline-flex items-center gap-2.5"><span class="grid h-8 w-8 place-items-center rounded-lg" :class="r.meta.tile"><i class="fa-solid text-xs" :class="r.meta.icon"></i></span><span class="font-medium" x-text="r.meta.label"></span></span></td>
                <td><a :href="r.href" class="font-medium hover:text-brand-600 hover:underline" x-text="r.ref"></a><span x-show="r.held" x-cloak class="badge badge-warn ms-2 text-[11px]">معلّقة</span><div class="max-w-[220px] truncate text-xs text-muted" x-text="r.sub"></div></td>
                <td><template x-if="r.kind === 'transfer'"><span class="inline-flex items-center gap-1.5"><loc-code :code="r.from"></loc-code><i class="fa-solid fa-arrow-left text-[10px] text-muted"></i><loc-code :code="r.to"></loc-code></span></template>
                  <template x-if="r.kind !== 'transfer'"><span x-text="r.party || '—'"></span></template></td>
                <td class="text-muted" x-text="r.user || '—'"></td><td class="text-muted" x-text="r.date"></td>
                <td class="tabular-nums" x-text="r.items"></td><td class="font-medium tabular-nums" x-text="r.value"></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="empty" x-show="!loading && !rows.length && !error" x-cloak><i class="fa-solid fa-inbox mb-3 text-4xl opacity-40"></i>مفيش حركات مطابقة</div>
        <div class="empty" x-show="error" x-cloak><p class="mb-3 text-red-500" x-text="error"></p><button type="button" class="btn btn-outline btn-sm" @click="load()">إعادة المحاولة</button></div>
      </div>
      <div class="border-t border-line px-4"><ui-pager :page="page" :pages="pages" :total="total" :size="size" @go="page = $event.detail; load()"></ui-pager></div>
    </section>
  </div>
</div>

<script type="module" src="js/layout.js"></script>
<script type="module" src="js/movements.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</body>
</html>
