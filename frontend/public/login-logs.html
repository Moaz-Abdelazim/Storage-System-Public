<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>سجل الدخول | مخزني</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="preload" href="fonts/tajawal-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/tajawal-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body>
<noscript><p class="p-8 text-center">لازم تفعّل JavaScript عشان النظام يشتغل.</p></noscript>

<div id="shell" data-active="login-logs" data-title="سجل الدخول" data-admin-only>
  <div x-data="loginLogs" class="space-y-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><h1 class="text-2xl font-bold">سجل الدخول</h1><p class="mt-1 text-sm text-muted">جلسات الدخول للنظام — وتقدر تنهي أي جلسة مفتوحة فورًا</p></div>
      <button type="button" class="btn btn-outline" @click="load()" :disabled="loading"><i class="fa-solid fa-rotate" :class="loading && 'animate-spin'"></i>تحديث</button>
    </div>

    <section class="card card-pad">
      <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-12">
        <div class="relative xl:col-span-3"><i class="fa-regular fa-user pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted"></i><input type="search" class="input ps-10" placeholder="اسم المستخدم" x-model="f.user" @input.debounce.350ms="apply()"></div>
        <div class="relative xl:col-span-2"><i class="fa-solid fa-network-wired pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-sm text-muted"></i><input type="search" class="input ps-10" dir="ltr" placeholder="IP" x-model="f.ip" @input.debounce.350ms="apply()"></div>
        <div class="seg xl:col-span-3"><template x-for="s in statuses" :key="s.key"><button type="button" class="seg-btn" :class="f.status === s.key && 'seg-btn-on'" @click="f.status = s.key; apply()" x-text="s.label"></button></template></div>
        <div class="flex items-center gap-2 xl:col-span-4"><input type="date" class="input" x-model="f.date_from" @change="apply()" aria-label="من"><span class="text-muted">←</span><input type="date" class="input" x-model="f.date_to" @change="apply()" aria-label="إلى"></div>
      </div>
    </section>

    <section class="card">
      <div class="overflow-x-auto px-3 pt-3">
        <table class="tbl">
          <thead><tr><th>المستخدم</th><th>وقت الدخول</th><th>وقت الخروج</th><th>المدة</th><th>IP</th><th>الحالة</th><th class="w-1"></th></tr></thead>
          <tbody>
            <template x-if="loading && !rows.length"><template x-for="i in 8"><tr><td colspan="7"><div class="skeleton h-7"></div></td></tr></template></template>
            <template x-for="l in rows" :key="l.id">
              <tr :class="loading && 'opacity-60'">
                <td class="font-medium" x-text="l.username || '—'"></td><td class="text-muted" x-text="fmtDateTime(l.login_time)"></td>
                <td class="text-muted" x-text="l.logout_time ? fmtDateTime(l.logout_time) : '—'"></td><td class="tabular-nums text-muted" x-text="duration(l)"></td>
                <td dir="ltr" class="text-end tabular-nums text-muted" x-text="l.ip_address || '—'"></td>
                <td><span class="badge" :class="l.is_active ? 'badge-ok' : 'badge-mute'" x-text="l.is_active ? 'مفتوحة' : (l.closed_by ? 'أنهاها ' + l.closed_by : 'مقفولة')"></span></td>
                <td><button type="button" class="btn btn-outline btn-sm text-red-600" x-show="l.is_active" @click="revoke(l)"><i class="fa-solid fa-power-off"></i>إنهاء</button></td>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="empty" x-show="!loading && !rows.length && !error" x-cloak><i class="fa-solid fa-shield-halved mb-3 text-4xl opacity-40"></i>مفيش سجلات مطابقة</div>
        <div class="empty" x-show="error" x-cloak><p class="mb-3 text-red-500" x-text="error"></p><button type="button" class="btn btn-outline btn-sm" @click="load()">إعادة المحاولة</button></div>
      </div>
      <div class="border-t border-line px-4"><ui-pager :page="page" :pages="pages" :total="total" :size="size" @go="page = $event.detail; load()"></ui-pager></div>
    </section>
  </div>
</div>

<script type="module" src="js/layout.js"></script>
<script type="module" src="js/login-logs.js"></script>
<script defer src="vendor/alpine.min.js"></script>
</body>
</html>
