name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: alembic check (no drift between models and baseline)
        env: { APP_ENV: development }
        run: |
          rm -f inventory.db
          python -m app.cli migrate
          python -m alembic check

  backend-mysql:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: makhzani_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/makhzani_test?charset=utf8mb4
      TEST_MIGRATION_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/makhzani_mig?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Create migration test DB
        run: mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS makhzani_mig CHARACTER SET utf8mb4"
      - name: Tests (MySQL 8, including concurrency + migrations)
        run: python -m pytest -q
      - name: alembic upgrade + check on a fresh MySQL database
        env:
          APP_ENV: development
          DB_ENGINE: mysql
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DB: makhzani_fresh
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE makhzani_fresh CHARACTER SET utf8mb4"
          python -m app.cli migrate
          python -m alembic check

  dependency-audit:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.txt --no-deps --disable-pip

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (node --test)
        run: npm test
      - name: Syntax check for every JS module
        run: npm run check:js
      - name: Tailwind output is up to date
        run: |
          npm run css
          git diff --exit-code -- public/css/app.css
